<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ================= renderer / scene =================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const DPR = Math.min(devicePixelRatio, 1.6);
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const skyDay = new THREE.Color(0xa9dcff), skyDusk = new THREE.Color(0xf5b98a), skyNight = new THREE.Color(0x0b1834);
scene.background = skyDay.clone();
scene.fog = new THREE.Fog(skyDay.clone(), 28, 60);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
camera.position.set(0, 9.5, 12.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.2, 0);
controls.enableDamping = true;
controls.maxPolarAngle = 1.35;
controls.minPolarAngle = 0.15;
controls.minDistance = 5;
controls.maxDistance = 28;

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const hemi = new THREE.HemisphereLight(0xd3ebff, 0x6a8f4a, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe2b8, 2.3);
sun.position.set(8, 13, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 50 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 3;
scene.add(sun);

// ================= post-processing =================
const composer = new EffectComposer(renderer);
composer.setPixelRatio(DPR);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.output = GTAOPass.OUTPUT.Default;
gtao.blendIntensity = 0.85;
gtao.updateGtaoMaterial({ radius: 0.45, distanceExponent: 1.5, thickness: 1, scale: 1, samples: 12 });
composer.addPass(gtao);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.28, 0.55, 0.88);
composer.addPass(bloom);
composer.addPass(new OutputPass());
let hq = true;
document.getElementById('hq').onclick = () => { hq = !hq; gtao.enabled = hq; flash(hq ? 'Đồ họa cao ✨' : 'Đồ họa nhẹ (mượt hơn)'); };

// ================= helpers =================
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const noise = (x, z) => Math.sin(x * 0.9 + 1.3) * Math.cos(z * 0.7 - 0.4) * 0.5 + Math.sin(x * 2.1 - z * 1.7) * 0.25 + Math.sin(z * 3.3 + x * 0.4) * 0.12;
const hash = i => { let h = (i * 2654435761) >>> 0; h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 13; return (h >>> 0) / 4294967296; };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// procedural water normal map
function waterNormals() {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S), hgt = new Float32Array(S * S);
  const waves = []; for (let k = 0; k < 14; k++) waves.push([1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6) * (Math.random() < .5 ? -1 : 1), Math.random() * 6.28, 1 / (k + 2)]);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let v = 0; for (const [a, b, p, amp] of waves) v += Math.sin((a * x + b * y) / S * 6.2832 + p) * amp; hgt[y * S + x] = v;
  }
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const l = hgt[y * S + (x + S - 1) % S], r = hgt[y * S + (x + 1) % S], u = hgt[((y + S - 1) % S) * S + x], d = hgt[((y + 1) % S) * S + x];
    const nx = (l - r) * 2, ny = (u - d) * 2, nz = 1, len = Math.hypot(nx, ny, nz), o = (y * S + x) * 4;
    img.data[o] = (nx / len * 0.5 + 0.5) * 255; img.data[o + 1] = (ny / len * 0.5 + 0.5) * 255; img.data[o + 2] = (nz / len * 0.5 + 0.5) * 255; img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const seaNormal = waterNormals(); seaNormal.repeat.set(30, 30);
const pondNormal = seaNormal.clone(); pondNormal.repeat.set(5, 5); pondNormal.needsUpdate = true;

// ================= terrain =================
const SIZE = 22, SEG = 150, STEP = SIZE / SEG, COLS = SEG + 1;
const LAND = 0.5, POND = 0.2;
const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position, N = pos.count;
const X = new Float32Array(N), Z = new Float32Array(N);
const base = new Float32Array(N), H = new Float32Array(N);
const paint = new Uint8Array(N), carved = new Uint8Array(N), blocked = new Uint8Array(N);
const col = new Float32Array(N * 3);
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
const zAsc = pos.getZ(0) < pos.getZ(N - 1);

for (let i = 0; i < N; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  X[i] = x; Z[i] = z;
  const a = Math.atan2(z, x);
  const R = 7.0 + Math.sin(a * 3 + 0.5) * 0.7 + Math.sin(a * 5) * 0.35;
  const d = Math.hypot(x, z) / R;
  const t = sm(1.1, 0.9, d);
  const hill = Math.exp(-((x + 2.5) ** 2 + (z + 2.2) ** 2) / 6) * 0.35;
  const h = -0.7 + t * (0.7 + LAND) + t * (noise(x * 0.6, z * 0.6) * 0.07 + hill);
  base[i] = h; H[i] = h;
}

const C = {
  grass: new THREE.Color(0x86d24e), grass2: new THREE.Color(0x5fb33c), grass3: new THREE.Color(0xa6dc5a),
  sand: new THREE.Color(0xf0dca6), wetSand: new THREE.Color(0xd8c088), shallow: new THREE.Color(0x56c7c4), deep: new THREE.Color(0x2a86b0),
  stone: new THREE.Color(0xa9a596), mud: new THREE.Color(0x7d8a62), path: new THREE.Color(0xe0c393), pathEdge: new THREE.Color(0xc9a978),
  pond: new THREE.Color(0x5fcde0), foam: new THREE.Color(0xeefcff)
};
const wcol = new Float32Array(N * 4);
const tmp = new THREE.Color(), tmp2 = new THREE.Color();
function colorAt(i) {
  const h = H[i], b = base[i];
  if (b < 0.32 && !carved[i]) {
    if (h < -0.3) tmp.copy(C.deep).lerp(C.shallow, sm(-0.7, -0.3, h));
    else if (h < 0.03) tmp.copy(C.shallow).lerp(C.wetSand, sm(-0.3, 0.03, h));
    else tmp.copy(C.wetSand).lerp(C.sand, sm(0.03, 0.12, h));
    if (h > 0.26) tmp.lerp(C.grass, sm(0.26, 0.4, h));
  } else if (carved[i] && b - h > 0.035) {
    tmp.copy(C.mud).lerp(C.stone, sm(POND - 0.05, POND + 0.05, h));
  } else {
    const n = noise(X[i] * 1.6, Z[i] * 1.6);
    tmp.copy(C.grass).lerp(C.grass2, clamp(n * 0.7 + 0.35)).lerp(C.grass3, clamp(noise(X[i] * 0.5 + 3, Z[i] * 0.5) * 0.6) * 0.5);
  }
  if (paint[i] && h > POND) {
    let edge = 0; // darker rim along path edges
    const c = i % COLS;
    if (c > 0 && !paint[i - 1]) edge = 1; if (c < SEG && !paint[i + 1]) edge = 1;
    if (i >= COLS && !paint[i - COLS]) edge = 1; if (i + COLS < N && !paint[i + COLS]) edge = 1;
    tmp.copy(edge ? C.pathEdge : C.path).offsetHSL(0, 0, (hash(i) - 0.5) * 0.04);
  }
  col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  // pond water tint: whiter where shallow (foam rim)
  const sh = sm(POND - 0.1, POND + 0.01, h);
  tmp2.copy(C.pond).lerp(C.foam, sh * 0.4);
  wcol[i * 4] = tmp2.r; wcol[i * 4 + 1] = tmp2.g; wcol[i * 4 + 2] = tmp2.b;
}
for (let i = 0; i < N; i++) colorAt(i);
geo.computeVertexNormals();

const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
terrain.receiveShadow = true; terrain.castShadow = true;
scene.add(terrain);

// pond water
const wgeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
wgeo.rotateX(-Math.PI / 2);
wgeo.setAttribute('color', new THREE.BufferAttribute(wcol, 4));
const pondMat = new THREE.MeshStandardMaterial({ vertexColors: true, transparent: true, roughness: 0.06, metalness: 0, normalMap: pondNormal, normalScale: new THREE.Vector2(0.35, 0.35), envMap: envTex, envMapIntensity: 0.9, depthWrite: false });
const pondWater = new THREE.Mesh(wgeo, pondMat);
pondWater.position.y = POND; pondWater.renderOrder = 3; pondWater.receiveShadow = true;
scene.add(pondWater);

// sea + seabed
const seaMat = new THREE.MeshStandardMaterial({ color: 0x2b96dd, transparent: true, opacity: 0.72, roughness: 0.05, metalness: 0, normalMap: seaNormal, normalScale: new THREE.Vector2(0.45, 0.45), envMap: envTex, envMapIntensity: 1.0, depthWrite: false });
const sea = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), seaMat);
sea.rotation.x = -Math.PI / 2; sea.renderOrder = 1; sea.receiveShadow = true;

function simTick(dt) {
  const G = GAME_DATA, B = G.build;
  const housing = buildings.reduce((a, b) => a + (B[b.kind].housing || 0), 0);
  // jobs: fill buildings in placement order
  let free = pop;
  for (const b of buildings) { const j = B[b.kind].jobs || 0; b.workers = Math.min(j, free); free -= b.workers; }
  // production
  for (const b of buildings) {
    const d = B[b.kind]; if (!d.cycle) continue;
    const eff = d.jobs ? b.workers / d.jobs : 1;
    if (eff <= 0) continue;
    if (d.in && !canAfford(d.in)) continue;
    b.prog += dt / d.cycle * eff;
    if (b.prog >= 1) {
      b.prog = 0; if (d.in) pay(d.in);
      for (const [k, v] of Object.entries(d.out)) { res[k] += v; floatText(`+${v} ${RES_ICON[k]}`, b.x, heightAt(b.x, b.z) + 0.9, b.z, '#fff7c0'); }
    }
  }
  // food
  let need = pop * G.eatPerPersonPerMin / 60 * dt;
  const fromRice = Math.min(res.rice, need); res.rice -= fromRice; need -= fromRice;

  const sellers = buildings.filter(b => b.kind === 'cho').reduce((a, b) => a + b.workers / B.cho.jobs, 0);
  if (sellers > 0) {
    let cap = G.sellPerMarketPerMin / 60 * dt * sellers;
    const reserve = { rice: pop * G.foodReservePerPerson, fish: pop * G.foodReservePerPerson / 2, coco: countB('candy') ? 9 : 0, candy: 0 };
    for (const k of ['candy', 'fish', 'coco', 'rice']) {
      const amt = Math.min(cap, Math.max(0, res[k] - reserve[k])); if (amt <= 0) continue;
      res[k] -= amt; res.money += amt * G.prices[k]; cap -= amt;
    }
  }
  // tax & happiness
  const houses = buildings.filter(b => B[b.kind].housing);
  happy = houses.length ? houses.reduce((a, h) => a + houseHappy(h), 0) / houses.length : 50;
  res.money += pop * G.taxPerPersonPerMin / 60 * dt * clamp(happy / 60, 0.3, 1.5);
  // migration
  immT += dt;
  if (immT > G.immigrateEvery) {
    immT = 0;
    if (pop < housing && happy >= G.arriveAboveHappy) { pop++; const h = houses[Math.floor(Math.random() * houses.length)]; floatText('+1 👤 dọn tới', h.x, heightAt(h.x, h.z) + 1.2, h.z, '#c8ffb0'); }
  }

  if (pop > housing) pop = housing;

  for (const k in res) res[k] = Math.max(0, res[k]);

  refreshToolStates();
  updateTutorial();
}

let terrainDirty = true;
function brushLand(x, z) {
  const R = 1.1;
  forEachNear(x, z, R, (i, d) => {
    const f = sm(R, R * 0.35, d);
    if (X[i] ** 2 + Z[i] ** 2 > 10.4 ** 2) return; // keep inside the map
    let nh;
    if (carved[i] && H[i] < base[i] - 0.01) { // fill a pond back in
      nh = Math.min(base[i], H[i] + 0.06 * f);
      if (nh >= base[i] - 0.015) { carved[i] = 0; wcol[i * 4 + 3] = 0; }
    } else if (H[i] < LAND - 0.02) { // sea / beach → new land
      nh = H[i] + (LAND + noise(X[i], Z[i]) * 0.03 - H[i]) * f;
      if (f > 0.02) landAdded = true;
    } else { // land → gentle hill
      nh = Math.min(H[i] + 0.025 * f, 1.5);
    }
    if (nh > H[i]) { H[i] = nh; if (!carved[i]) base[i] = Math.max(base[i], nh); }
  });
  forEachNear(x, z, R + STEP * 2, i => colorAt(i));
  terrainDirty = true;
}
function brushPond(x, z) {
  const R = 1.0, target = POND - 0.17;
  forEachNear(x, z, R * 1.3, (i, d) => {
    if (base[i] < 0.34) return;
    if (d <= R) {
      const f = sm(R, R * 0.45, d);
      const nh = base[i] + (target - base[i]) * f;
      if (nh < H[i]) H[i] = nh;
      paint[i] = 0;
    }
    carved[i] = 1;
    wcol[i * 4 + 3] = Math.max(wcol[i * 4 + 3], d <= R ? 0.85 : 0.85 * sm(R * 1.3, R, d));
  });
  forEachNear(x, z, R * 1.6, i => colorAt(i));
  terrainDirty = true;
}
let lastPlank = null, lastFence = null, lastLand = null;
function brushPath(x, z, dir) {
  const R = 0.36;
  const idx = idxAt(x, z);
  if (idx >= 0 && H[idx] < POND + 0.03 && base[idx] > 0.3) {
    if (!lastPlank) lastPlank = lastLand ? { ...lastLand } : { x, z };
    if (Math.hypot(lastPlank.x - x, lastPlank.z - z) > 0.45) {
      const p = makeMonkeyBridge(V(lastPlank.x, 0, lastPlank.z), V(x, 0, z)); objects.add(p); action.added.push(p); lastPlank = { x, z };
    }
    return;
  }
  if (lastPlank) {
    if (Math.hypot(lastPlank.x - x, lastPlank.z - z) > 0.1) { const p = makeMonkeyBridge(V(lastPlank.x, 0, lastPlank.z), V(x, 0, z)); objects.add(p); action.added.push(p); }
    lastPlank = null;
  }
  lastLand = { x, z };
  forEachNear(x, z, R, (i, d) => { if (base[i] > 0.3 && H[i] > POND + 0.02) { paint[i] = 1; H[i] = Math.min(H[i], base[i] - 0.02 * sm(R, 0, d)); } });
  forEachNear(x, z, R + STEP * 2, i => colorAt(i));
  terrainDirty = true;
}
function brushFence(x, z, dir) {

  const i = idxAt(x, z); if (i < 0 || H[i] < 0.32 || (carved[i] && H[i] < base[i] - 0.03)) return;

  H.set(a.H); base.set(a.base); paint.set(a.paint); carved.set(a.carved); blocked.set(a.blocked); wcol.set(a.wa);
  a.added.forEach(o => objects.remove(o)); a.removed.forEach(o => objects.add(o));
  if (a.econ) { const { type, obj, cost } = a.econ; if (type === 'buy') { unregister(obj); pay(cost, 1); } else { buildings.push(obj.userData.bld); pay(cost, -1, 0.5); } }
  for (let i = 0; i < N; i++) colorAt(i);
  terrainDirty = true;
};

// ================= input =================
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function setRay(e) { const r = renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); }
function pick(e) { setRay(e); return ray.intersectObject(terrain)[0]; }
const pointers = new Map();
let drawing = false, last = null, downAt = null;
function applyBrush(x, z, dir) {
  if (tool === 'pond') brushPond(x, z); else if (tool === 'path') brushPath(x, z, dir);
  else if (tool === 'land') brushLand(x, z); else if (tool === 'fence') brushFence(x, z, dir);
}
renderer.domElement.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, e);
  if (pointers.size > 1) { if (drawing) { drawing = false; commitAction(); checkTasks(); } downAt = null; return; }
  downAt = { x: e.clientX, y: e.clientY };
  if (DRAW_TOOLS.includes(tool)) {
    const h = pick(e); if (!h) return;
    drawing = true; beginAction(); lastPlank = null; lastFence = null; lastLand = null;
    last = h.point.clone();
    applyBrush(last.x, last.z, new THREE.Vector2(1, 0));
  }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, e);
  if (!drawing || pointers.size > 1) return;
  const h = pick(e); if (!h) return;
  const p = h.point, dx = p.x - last.x, dz = p.z - last.z, dist = Math.hypot(dx, dz);
  const stepLen = tool === 'pond' || tool === 'land' ? 0.22 : 0.1;
  if (dist < stepLen) return;
  const dir = new THREE.Vector2(dx / dist, dz / dist);
  const n = Math.floor(dist / stepLen);
  for (let k = 1; k <= n; k++) applyBrush(last.x + dir.x * stepLen * k, last.z + dir.y * stepLen * k, dir);
  last.set(last.x + dir.x * stepLen * n, 0, last.z + dir.y * stepLen * n);
});
function endPointer(e) {
  const wasSingle = pointers.size === 1;
  pointers.delete(e.pointerId);
  if (drawing) { drawing = false; commitAction(); checkTasks(); return; }
  if (!wasSingle || !downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 10) return;
  if (tool === 'erase') return eraseAt(e);
  if (tool === 'view') return showInfo(e);
  if (GHOST_KINDS.includes(tool)) ghostAt(e);
  else if (PLACE_TOOLS.includes(tool)) placeAt(e);
}
renderer.domElement.addEventListener('pointerup', endPointer);
renderer.domElement.addEventListener('pointercancel', endPointer);
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

function withSeed(seed, fn) {
  const orig = Math.random; let st = (Math.abs(seed) % 2147483646) + 1;
  Math.random = () => (st = (st * 16807) % 2147483647) / 2147483647;
  try { return fn(); } finally { Math.random = orig; }
}
const newSeed = () => Math.floor(Math.random() * 2e9);
function makeObj(kind, seed) {
  const CUSTOM = { house: makeHouse, boat: makeBoat, banana: makeBanana, nipa: makeNipa, lu: makeLu, field: makeField, fishery: makeFishery, bamboo: makeBamboo, candy: makeCandy, cho: makeCho, dinh: makeDinh };
  const o = withSeed(seed, () => {
    if (CUSTOM[kind]) return CUSTOM[kind]();
    if (assetsReady && CATALOG[kind]) return makeAsset(kind);
    return kind === 'tree' ? makeTree() : kind === 'palm' ? makePalm() : kind === 'bush' ? makeBush() : makeHouse();
  });
  o.userData.seed = seed;
  return o;
}
function addObject(kind, x, z, y, animate = true, preset = false, seed = newSeed()) {
  const o = makeObj(kind, seed);
  o.position.set(x, y - 0.02, z);
  if (animate) { o.userData.target = o.scale.x; o.scale.setScalar(0.001); o.userData.grow = 0; }
  if (preset) o.userData.preset = true;
  objects.add(o);
  markBlocked(x, z, BLOCK[kind] ?? 0.2);
  registerBuilding(kind, o, preset);
  return o;
}
function flattenAt(x, z, r, y) {
  forEachNear(x, z, r, (i, d) => { if (carved[i]) return; const f = sm(r, r * 0.55, d); H[i] = lerp(H[i], y, f); base[i] = H[i]; paint[i] = d < r * 0.6 ? 0 : paint[i]; });
  forEachNear(x, z, r + STEP * 2, i => colorAt(i));
  terrainDirty = true;
}
const FLAT = { house: 0.75, field: 1.05, candy: 0.75, cho: 1.1, dinh: 1.3 };
function isWater(x, z) { const i = idxAt(x, z); if (i < 0) return true; return H[i] < 0.03 || (carved[i] && H[i] < base[i] - 0.03); }
function shoreDir(x, z) {
  let best = null;
  for (let a = 0; a < 6.28; a += 0.2) for (let d = 0.4; d <= 1.5; d += 0.1) {
    if (isWater(x + Math.sin(a) * d, z + Math.cos(a) * d)) { if (!best || d < best.d) best = { a, d }; break; }
  }
  return best;
}
function placeCheck(p, kind) {
  const i = idxAt(p.x, p.z), def = GAME_DATA.build[kind];
  if (def && !rankUnlocked(def.unlock)) return `🔒 Cần lên ${GAME_DATA.ranks.find(r => r.id === def.unlock).name} mới mở`;
  if (def && !canAfford(def.cost)) return `Chưa đủ ${costText(def.cost)}`;
  const inPond = i >= 0 && carved[i] && H[i] < base[i] - 0.03, inSea = i < 0 || H[i] < 0.02;
  if (kind === 'boat') return (!inPond && !inSea) ? 'Xuồng phải thả dưới nước nha anh' : null;
  if (i < 0 || H[i] < 0.32 || inPond) return 'Chỗ này là nước, chọn chỗ đất nha';
  if (kind === 'fishery' && !shoreDir(p.x, p.z)) return 'Bến cá phải đặt sát mé nước (ao hoặc biển)';
  return null;
}
function placeAtPoint(p, kind, seed = newSeed(), ry = null) {
  const err = placeCheck(p, kind); if (err) { flash(err); return null; }
  const i = idxAt(p.x, p.z), def = GAME_DATA.build[kind];
  const inPond = i >= 0 && carved[i] && H[i] < base[i] - 0.03;
  let o;
  beginAction();
  if (kind === 'boat') {
    o = addObject('boat', p.x, p.z, (inPond ? POND : 0) - 0.02, true, false, seed);
    o.userData.floatY = o.position.y; o.userData.pond = inPond;
  } else if (kind === 'fishery') {
    o = addObject('fishery', p.x, p.z, p.y, true, false, seed); o.rotation.y = shoreDir(p.x, p.z).a;
  } else {
    if (FLAT[kind]) flattenAt(p.x, p.z, FLAT[kind], p.y);
    o = addObject(kind, p.x, p.z, p.y, true, false, seed);
    if (ry !== null) o.rotation.y = ry;
  }
  if (def) { pay(def.cost); action.econ = { type: 'buy', obj: o, cost: def.cost }; floatText('-' + costText(def.cost), p.x, p.y + 0.8, p.z, '#ffd0c0'); }
  action.added.push(o); commitAction();
  terrainDirty = true;
  checkTasks(); saveSoon();
  return o;
}
function placeAt(e) { const h = pick(e); if (h) placeAtPoint(h.point, tool); }
function eraseAt(e) {
  setRay(e);
  const hit = ray.intersectObjects(objects.children, true)[0]; if (!hit) return;
  let o = hit.object; while (o.parent !== objects) o = o.parent;
  beginAction();
  objects.remove(o); action.removed.push(o);
  const k = o.userData.kind, def = GAME_DATA.build[k];
  if (o.userData.bld) { unregister(o); if (def) { pay(def.cost, 1, 0.5); action.econ = { type: 'sell', obj: o, cost: def.cost }; floatText('+' + costText(Object.fromEntries(Object.entries(def.cost).map(([a, b]) => [a, Math.floor(b / 2)]))), o.position.x, o.position.y + 0.8, o.position.z, '#c8ffb0'); } }
  if (k !== 'plank' && k !== 'fence') markBlocked(o.position.x, o.position.z, BLOCK[k] ?? 0.2, 0);
  commitAction(); terrainDirty = true;
}
function showInfo(e) {
  setRay(e);
  const hit = ray.intersectObjects(objects.children, true)[0]; if (!hit) return;
  let o = hit.object; while (o.parent !== objects) o = o.parent;
  const b = o.userData.bld; if (!b) return;
  const d = GAME_DATA.build[b.kind], name = (TOOLS.find(t => t.id === b.kind) || {}).name || b.kind;
  let txt = name;
  if (d.housing) txt += ` · 😊 ${Math.round(houseHappy(b))} · ${near(b, 'water') ? '💧' : '❌💧'} ${near(b, 'market') ? '🧺' : ''} ${near(b, 'temple') ? '⛩️' : ''}`;
  if (d.jobs) txt += ` · 👷 ${b.workers}/${d.jobs}`;
  if (d.cycle) txt += ` · ${Math.round(b.prog * 100)}% → ${costText(d.out)}`;
  floatText(txt, b.x, o.position.y + 1.1, b.z, '#ffffff');
}

// ================= preset decoration =================
function placePresets() {
  seed = 42;
  const presets = ['tree', 'tree', 'tree', 'tree', 'palm', 'palm', 'palm', 'palm', 'banana', 'banana', 'banana', 'bush', 'bush', 'bush', 'bush', 'nipa', 'nipa', 'nipa', 'bamboo'];
  presets.forEach(kind => {
    for (let t = 0; t < 40; t++) {
      const a = rnd() * 6.28, r = kind === 'palm' || kind === 'nipa' ? 5.4 + rnd() * 0.7 : kind === 'bamboo' ? 3 + rnd() : 3.4 + rnd() * 2.4;
      const x = Math.cos(a) * r, z = Math.sin(a) * r, i = idxAt(x, z);
      if (i >= 0 && H[i] > 0.4 && !blocked[i]) { addObject(kind, x, z, H[i], false, true); break; }
    }
  });
  const hx = 2.4, hz = -1.4; flattenAt(hx, hz, 0.75, heightAt(hx, hz)); const h = addObject('house', hx, hz, heightAt(hx, hz), false, true); h.rotation.y = 0.45;
  addObject('lu', hx - 0.9, hz + 0.6, heightAt(hx - 0.9, hz + 0.6), false, true);
  let bx = 6.6, bz = 3.2;
  for (let r = 5; r < 10; r += 0.2) { const x = Math.cos(0.5) * r, z = Math.sin(0.5) * r; if (heightAt(x, z) < -0.2) { bx = x + 0.3; bz = z + 0.2; break; } }
  const b = addObject('boat', bx, bz, -0.02, false, true); b.userData.floatY = -0.02; b.userData.pond = false;
  pop = GAME_DATA.startPop;
}

// ================= day / night =================
const timeEl = document.getElementById('time');
const sunDay = new THREE.Color(0xffe2b8), sunDusk = new THREE.Color(0xff9a5c), sunNight = new THREE.Color(0x7d8cff);
let nightF = 0;
function applyTime() {
  const t = +timeEl.value, dusk = sm(0.25, 0.5, t) * (1 - sm(0.55, 0.8, t)), n = sm(0.5, 0.85, t);
  nightF = n;
  scene.background.copy(skyDay).lerp(skyDusk, dusk).lerp(skyNight, n);
  scene.fog.color.copy(scene.background);
  sun.intensity = lerp(2.3, 0.25, n);
  sun.color.copy(sunDay).lerp(sunDusk, dusk).lerp(sunNight, n);
  sun.position.set(lerp(8, -8, t), lerp(13, 6, sm(0, 0.6, t)) + n * 5, 5);
  hemi.intensity = lerp(0.85, 0.22, n);
  seaMat.color.setHex(0x2b96dd).lerp(new THREE.Color(0x0e2d5c), n);
  cloudMat.emissiveIntensity = lerp(0.15, 0.0, n);
  mats.win.emissiveIntensity = sm(0.45, 0.75, t) * 3;
  ffMat.opacity = n;
  seaMat.envMapIntensity = lerp(1.0, 0.35, n); pondMat.envMapIntensity = lerp(0.9, 0.4, n);
  bloom.strength = lerp(0.25, 0.9, n);
  renderer.toneMappingExposure = lerp(1.05, 1.25, n);
  MT.lantern.emissiveIntensity = sm(0.45, 0.75, t) * 2.5;
}
timeEl.addEventListener('input', applyTime);
applyTime();

// ================= loop =================
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerWidth < innerHeight ? 58 : 40;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let simAcc = 0;
function animateBuildings(dt, et) {
  for (const b of buildings) {
    const u = b.obj.userData;
    if (u.rice) { const g = b.prog, s = 0.35 + g * 0.75; u.rice.scale.set(1, s, 1); u.rice.material.color.setHSL(lerp(0.27, 0.13, sm(0.6, 1, g)), 0.6, lerp(0.42, 0.55, g)); }
    if (u.lever) { const w = b.workers > 0 ? 1 : 0; u.lever.rotation.x = w * (Math.sin(et * 0.8 + b.x) * 0.35 + 0.05); }
    if (u.smoke) for (const s of u.smoke) {
      const on = b.workers > 0 && canAfford(GAME_DATA.build.candy.in);
      s.userData.t = (s.userData.t + dt * 0.35) % 1; const t = s.userData.t;
      s.position.set(u.chimney.x + Math.sin(t * 6 + et) * 0.05 * t, u.chimney.y + t * 0.8, u.chimney.z);
      s.scale.setScalar(0.6 + t * 1.8); s.material.opacity = on ? 0.45 * (1 - t) : 0;
    }
  }
}
loadPack();
const clock = new THREE.Clock();
let fpsAcc = 0, fpsN = 0, autoChecked = false;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), et = clock.elapsedTime;
  uTime.value = et;
  if (terrainDirty) {
    for (let i = 0; i < N; i++) pos.setY(i, H[i]);
    pos.needsUpdate = true; geo.attributes.color.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere();
    wgeo.attributes.color.needsUpdate = true;
    rebuildDetail();
    terrainDirty = false;
  }
  seaNormal.offset.set(et * 0.006, et * 0.004);
  pondNormal.offset.set(-et * 0.01, et * 0.007);
  sea.position.y = Math.sin(et * 0.9) * 0.015;
  foam.position.y = 0.012 + Math.sin(et * 0.9) * 0.015;
  foamMat.opacity = 0.55 + Math.sin(et * 1.6) * 0.25;
  objects.children.forEach(o => {
    const u = o.userData;
    if (u.grow !== undefined && u.grow < 1) {
      u.grow = Math.min(1, u.grow + dt * 2.8);
      const g = u.grow; o.scale.setScalar(Math.max(0.001, u.target * g * (1 + Math.sin(g * Math.PI) * 0.2)));
    }
    if (u.kind === 'palm' || u.kind === 'tree') o.rotation.z = Math.sin(et * 1.2 + o.position.x * 0.7) * 0.02;
    if (u.spin) for (const f of u.spin) f.rotation.z += dt * 1.1;
    if (u.floatY !== undefined) { o.position.y = u.floatY + Math.sin(et * 1.5 + o.position.x) * 0.012 + (u.pond ? 0 : sea.position.y); o.rotation.z = Math.sin(et * 1.1 + o.position.z) * 0.04; o.rotation.x = Math.sin(et * 0.9 + o.position.x) * 0.03; }
    if (u.kind === 'banana' || u.kind === 'nipa') o.rotation.z = Math.sin(et * 1.4 + o.position.x * 0.9) * 0.025;
  });
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 18) c.position.x = -18; });
  if (nightF > 0.01) {
    for (let k = 0; k < FF; k++) {
      const [x, z, p] = ffSeed[k];
      const hx = x + Math.sin(et * 0.4 + p) * 0.6, hz = z + Math.cos(et * 0.35 + p * 2) * 0.6;
      ffPos[k * 3] = hx; ffPos[k * 3 + 1] = Math.max(heightAt(hx, hz), POND) + 0.35 + Math.sin(et * 0.9 + p) * 0.2; ffPos[k * 3 + 2] = hz;
    }
    ffGeo.attributes.position.needsUpdate = true;
  }
  simAcc += dt; if (simAcc >= 0.25) { simTick(simAcc); simAcc = 0; syncVillagers(); }
  animateBuildings(dt, et);
  updateTrader(dt);
  positionGhostUI();
  updateFloaters(dt);
  updatePeople(dt);
  stepCamera(dt);
  controls.update();
  composer.render();
  // auto-lower quality on slow devices
  if (!autoChecked && et > 1.5) {
    fpsAcc += dt; fpsN++;
    if (fpsN >= 90) { autoChecked = true; if (fpsN / fpsAcc < 32 && hq) { hq = false; gtao.enabled = false; flash('Máy hơi yếu – em giảm đồ họa cho mượt (bấm ✨ để bật lại)', 3000); } }
  }
});
